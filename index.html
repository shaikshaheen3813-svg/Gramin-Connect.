<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gramin Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--cream:#faf6ea;--ink:#1d2b22;--dg:#14532d;--g:#2f855a;--lg:#e3f2e8;--mut:#5b6b60;--bd:#e1dccb;--warn:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--cream:#16241b;--ink:#e8efe9;--dg:#9be3b4;--g:#5fc08a;--lg:#1c3326;--mut:#9fb3a5;--bd:#2a3d31;--warn:#3a3213}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 Nunito,"Noto Sans Telugu",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{color:var(--dg);line-height:1.25;margin:0 0 .4em}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
.bar{max-width:1050px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--dg);cursor:pointer;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a,.btn{padding:8px 12px;border-radius:999px;cursor:pointer;text-decoration:none;color:var(--dg);font-weight:600;border:0;background:none;font:inherit;font-weight:600}
nav a.on,nav a:hover{background:var(--lg)}
.btn{background:var(--dg);color:var(--bg);display:inline-block}.btn.alt{background:var(--lg);color:var(--dg)}.btn.sm{padding:5px 10px;font-size:14px}
main{max-width:1050px;margin:auto;padding:20px 16px 60px}
.hero{background:var(--cream);border-radius:20px;padding:28px 20px;text-align:center;border:1px solid var(--bd)}
.hero svg{max-width:100%;height:90px}
.hero h1{font-size:clamp(26px,5vw,40px)}
.sb{display:flex;gap:8px;max-width:620px;margin:16px auto 0}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin:16px 0}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:16px}
.cat{cursor:pointer;text-align:center;background:var(--cream)}.cat:hover{border-color:var(--g)}.cat .ic{font-size:34px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--lg);color:var(--dg);margin:0 4px 6px 0;font-weight:700}
.tag.v{background:#d4f5de;color:#14532d}.tag.u{background:var(--warn);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:999px;cursor:pointer;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}.chip.on{background:var(--dg);color:var(--bg);border-color:var(--dg)}
.note{background:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
ol,ul{padding-left:20px}label.ck{display:flex;gap:8px;align-items:flex-start;margin:6px 0}label.ck input{width:auto;margin-top:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 160px}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer{background:var(--dg);color:#fff;padding:24px 16px;text-align:center;font-size:14px}footer a{color:#cfeedb}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
.lk{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}.lk small{color:var(--mut);word-break:break-all}.row2{display:flex;gap:6px;flex-wrap:wrap}
#cbBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:999px;padding:12px 18px;background:var(--dg);color:var(--bg);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 14px #0004}
#cbPanel{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:16;width:min(400px,calc(100vw - 32px));height:min(580px,calc(100vh - 110px));background:var(--bg);border:1px solid var(--bd);border-radius:18px;box-shadow:0 8px 30px #0005;flex-direction:column;overflow:hidden}
#cbPanel .ch{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--lg);color:var(--dg)}#cbPanel .cn{font-size:12px;color:var(--mut);padding:6px 12px;background:var(--warn)}
#cbMsgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.mu{align-self:flex-end;background:var(--dg);color:var(--bg);padding:8px 12px;border-radius:14px 14px 2px 14px;max-width:85%}.mb{align-self:flex-start;background:var(--cream);border:1px solid var(--bd);padding:8px 12px;border-radius:14px 14px 14px 2px;max-width:95%}.cbtn{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.cin input{flex:1}.cin .btn{flex:none}
@media(max-width:520px){#cbBtn span{display:none}}
.fa-sheet{border:4px solid #dc2626;text-align:center}.fa-sheet h2{color:#ef4444;font-size:26px}.fa-sheet ul,.fa-sheet ol{text-align:left}
.fa-big{font-size:64px;line-height:1;display:inline-block;animation:faP .6s infinite alternate}@keyframes faP{from{transform:scale(1)}to{transform:scale(1.18)}}
@media(prefers-reduced-motion:reduce){.fa-big{animation:none}}
.fa-res{border-radius:16px;padding:16px;margin-top:16px;border:2px solid var(--bd)}.fa-res h2{margin-top:0}
.fa-res.fake{border-color:#dc2626;background:rgba(220,38,38,.12)}.fa-res.sus{border-color:#d97706;background:rgba(245,158,11,.14)}.fa-res.ok{border-color:#2f855a;background:rgba(47,133,90,.14)}.fa-res.unk{background:var(--cream)}
.fa-ta{min-height:110px;resize:vertical}
.wk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.wk-tabs button{flex:1 1 120px}
.wk-ln{font-size:14px;margin:2px 0;color:var(--mut)}.wk-ln b{color:var(--ink)}
.wk-lock{background:var(--lg);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.wk-st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn);margin-left:6px}.wk-st.allowed{background:#d4f5de;color:#14532d}.wk-st.declined{background:#fee2e2;color:#7f1d1d}
.wk-form label{display:block;font-weight:600;margin:10px 0 4px}.wk-form .ck{font-weight:400}
.wk-msg{margin-top:10px}
</style></head><body>

let GC_AUD=null,GC_WARNED=false;
function gcVoice(lang){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[],want=lang=="te"?"te":"en";
return vs.find(v=>v.lang.replace("_","-").toLowerCase()==(want=="te"?"te-in":"en-in"))||vs.find(v=>v.lang.toLowerCase().startsWith(want))||null}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=()=>{};speechSynthesis.getVoices()}
function gcClean(t){return String(t).replace(/[•🚑🏥👩🧒👮☎🚨🔗📞📄🔊]/g,"").replace(/\s*\n+\s*/g,". ").replace(/\s+/g," ").trim()}
function gcChunks(t,n){const out=[];let cur="";t.split(/(?<=[.!?।])\s+/).forEach(x=>{if((cur+" "+x).length>n&&cur){out.push(cur);cur=x}else cur=(cur?cur+" ":"")+x});if(cur)out.push(cur);return out}
function gcStop(){try{speechSynthesis.cancel()}catch(e){}if(GC_AUD){try{GC_AUD.pause()}catch(e){}GC_AUD=null}}
function gcSpeak(text,lang,rate){gcStop();text=gcClean(text);if(!text)return;
const v=gcVoice(lang);
if(v||lang!="te"){try{const u=new SpeechSynthesisUtterance(text);if(v){u.voice=v;u.lang=v.lang}else u.lang="en-IN";u.rate=rate||.9;speechSynthesis.speak(u)}catch(e){}return}
/* No Telugu voice on this phone: use online Telugu voice so it does not sound foreign */
const parts=gcChunks(text,180);let i=0;
const next=()=>{if(i>=parts.length)return;const a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=te&q="+encodeURIComponent(parts[i++]));GC_AUD=a;a.onended=next;a.onerror=()=>{if(!GC_WARNED){GC_WARNED=true;alert("Telugu voice is not installed. Phone Settings > Text-to-speech > Google > Install voice data > Telugu.")}};a.play().catch(()=>{})};next()}
function speak(i){try{const m=CB.msgs[i];if(!m||!m.b)return;gcSpeak(m.b.text,/[\u0C00-\u0C7F]/.test(m.b.text)?"te":"en")}catch(e){}}
function cbVoice(){try{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("Voice not supported in this browser.");const r=new R();r.lang=S.lang=="te"?"te-IN":"en-IN";r.onresult=e=>cbAsk(e.results[0][0].transcript);r.start()}catch(e){alert("Voice unavailable.")}}

async function cbAI(){const msgs=[];CB.msgs.filter(m=>m.u||(m.b&&!m.b.typing&&m.b.text)).slice(-9).forEach(m=>{const role=m.u?"user":"assistant",content=m.u||m.b.text;if(!msgs.length&&role!="user")return;if(msgs.length&&msgs[msgs.length-1].role==role)msgs[msgs.length-1].content+="\n"+content;else msgs.push({role,content})});
const ac=new AbortController(),to=setTimeout(()=>ac.abort(),25000);
try{const res=await fetch(GC_AI.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs,lang:S.lang,context:cbContext()}),signal:ac.signal});if(!res.ok)throw new Error("http "+res.status);const d=await res.json();const rep=String(d.reply||"").replace(/\*\*|__|^#{1,6}\s*/gm,"").trim();if(!rep)throw new Error("empty");return rep}finally{clearTimeout(to)}}
cbAsk=function(q){q=(q||"").trim();if(!q)return;CB.msgs.push({u:q});const i=$("#cbIn");if(i)i.value="";
const t=q.toLowerCase(),loc=answer(q),emerg=anyK(t,IN.help)&&!matchItems(t).length,fake=faAnalyze(q).level=="fake";
if(!GC_AI.endpoint||emerg||fake){CB.msgs.push({b:loc});cbDraw();return}
const idx=CB.msgs.push({b:{text:"…",ids:[],chips:[],typing:true}})-1;cbDraw();
cbAI().then(rep=>{CB.msgs[idx]={b:Object.assign({},loc,{text:rep})};cbDraw()}).catch(()=>{CB.msgs[idx]={b:loc};cbDraw()})};
CB.msgs=[];cbShell();

S.view=location.hash.slice(1)||"home";render();
</script></body></html>
